<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temporal Memory Agent</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; }
      #root { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
      .list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .bubble { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; max-width: 85%; line-height: 1.45; }
      .user { align-self: flex-end; background: #2563eb; color: #fff; }
      .assistant { align-self: flex-start; background: rgba(128,128,128,.15); }
      .meta { font-size: 12px; opacity: .7; margin-top: 6px; }
      details { margin-top: 8px; font-size: 13px; }
      details a { word-break: break-all; }
      .status { padding: 4px 16px; font-size: 12px; opacity: .7; min-height: 18px; }
      .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid rgba(128,128,128,.3); }
      textarea { flex: 1; resize: none; padding: 8px; font: inherit; border-radius: 8px; }
      button { padding: 0 18px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
